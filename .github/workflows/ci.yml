name: Checks

# Draait bij elke pull request en bij elke push naar main: de extractietests en
# de typecontrole van de website. De testgevallen in pipeline/test_*.py bewaken
# precies de fouten die eerder verzonnen opdrachten en wisselingen opleverden;
# tot nu toe draaide niets ze automatisch, dus een regressie kon stil op main
# belanden. De TypeScript-kant ving alleen Vercel, en pas bij het deployen.
#
# De tussenstanden van de oogst tellen niet mee als wijziging. Die map bevat
# alleen meetresultaten — een csv met gevonden opdrachten en een lijst met
# bekeken organisaties — en het oogstscript commit die elke paar minuten, want
# anders gaat er werk verloren als de omgeving opnieuw begint. Elke commit
# startte daardoor een volledige ronde tests én een npm-installatie met
# typecontrole, terwijl er geen regel code veranderde. Op een ochtend zijn dat
# tientallen runs, en Actions-minuten zijn hier schaars.
#
# Verandert er naast die map ook maar één ander bestand, dan draait alles
# gewoon: paths-ignore slaat een run alleen over als *alle* gewijzigde bestanden
# eronder vallen.
on:
  pull_request:
    paths-ignore:
      - "pipeline/oogst/**"
  push:
    branches: [main]
    paths-ignore:
      - "pipeline/oogst/**"

jobs:
  extractietests:
    name: Extractietests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Alles wat pipeline/test_*.py heet, gevonden in plaats van opgesomd.
      #
      # Hier stond een lijst met de testbestanden erin, en zo'n lijst loopt
      # achter: een nieuw testbestand draaide dan niet mee zonder dat iets dat
      # meldde. Dezelfde valkuil zat in twee testbestanden zelf, waar het totaal
      # met de hand werd bijgehouden ("27/27" terwijl er 29 controles liepen).
      # Een lijst die stil incompleet is, is erger dan geen lijst.
      #
      # Alle bestanden draaien, ook na een fout: één keer kijken laat dan zien
      # wat er allemaal stuk is in plaats van alleen het eerste.
      - name: Extractietests
        run: |
          mislukt=0
          for test in pipeline/test_*.py; do
            echo "::group::$test"
            python3 "$test" || { mislukt=1; echo "::error::$test faalt"; }
            echo "::endgroup::"
          done
          exit $mislukt
      - name: Alles compileert
        run: python3 -m compileall -q pipeline

  typecontrole:
    name: Typecontrole website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
