name: Checks

# Draait bij elke pull request en bij elke push naar main: de extractietests en
# de typecontrole van de website. De testgevallen in pipeline/test_*.py bewaken
# precies de fouten die eerder verzonnen opdrachten en wisselingen opleverden;
# tot nu toe draaide niets ze automatisch, dus een regressie kon stil op main
# belanden. De TypeScript-kant ving alleen Vercel, en pas bij het deployen.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  extractietests:
    name: Extractietests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kantoormatch (echte gevallen uit jaarverslagen)
        run: python3 pipeline/test_kantoor_match.py
      - name: Naam- en plaatsschoonmaak
        run: python3 pipeline/test_digimv.py
      - name: OOB-cliëntenlijsten lezen
        run: python3 pipeline/test_transparantie.py
      - name: AFM-register verslaggeving lezen
        run: python3 pipeline/test_afm_verslaggeving.py
      - name: Kantoorcliënten uit openbare jaarstukken
        run: python3 pipeline/test_kantoorclienten.py
      - name: Gunningen uit TED lezen
        run: python3 pipeline/test_tenderned.py
      - name: dVi-leesregels
        run: python3 pipeline/test_aw_dvi.py
      - name: Alles compileert
        run: python3 -m compileall -q pipeline

  typecontrole:
    name: Typecontrole website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
