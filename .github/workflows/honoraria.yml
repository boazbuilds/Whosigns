name: Honoraria bijvullen

# Vult de dataset-velden (honoraria, wisselvlag, omzet, subsector, rechtsvorm)
# bij op opdrachten die al in de database staan — voor élk boekjaar waarvan een
# jaardataset bestaat, niet alleen het lijstjaar van de zorgroute.
#
# Waarom dit een eigen knop is. "Zorgdata laden" draait vul_extra_velden alleen
# voor zijn lijstjaar, en dat is 2023; de honoraria van 2022 (leesbaar sinds de
# koprijreparatie van 21-8-2026) kwamen daardoor nergens binnen. Dit werk kost
# seconden — het is een handvol Supabase-verzoeken, geen archief en geen pdf's —
# dus het kan zorgeloos in "Alles verversen" meedraaien.
#
# 2024 staat sinds de kolominspectie van 22-8-2026 in de standaardlijst: de
# vierdelige export past op de bestaande veldpatronen (1.047 organisaties, 108
# controlehonoraria, 960 gerapporteerde oordelen). Zie adapters/digimv.md.
# 2021 en 2020 staan sinds 1-9-2026 in de standaardlijst: die datasets bleken
# gewoon het moderne formaat te dragen (877 en 881 controlehonoraria plus
# wisselvlag en verklaringsdatum) — de aanname "oud formaat" gold alleen 2019.
on:
  workflow_dispatch:
    inputs:
      boekjaren:
        description: "Datasetjaren, komma's ertussen"
        required: false
        default: "2024,2023,2022,2021,2020"
  workflow_call:
    inputs:
      boekjaren:
        type: string
        required: false
        default: "2024,2023,2022,2021,2020"
  # Draait vanzelf zodra de vuller of deze workflow zelf op main landt —
  # zelfde patroon als de andere ladingen; een push-event heeft geen inputs,
  # dus de stap hieronder valt dan terug op de standaardjaren.
  push:
    branches: [main]
    paths:
      - "pipeline/vul_extra_velden.py"
      - ".github/workflows/honoraria.yml"

jobs:
  bijvullen:
    name: Datasetvelden bijvullen
    runs-on: ubuntu-latest
    # Vijf jaargangen, elk met een download van tientallen MB bij een koude
    # cache; de eerste run met 2021+2020 erbij haalde de oude grens van 30 net
    # niet ruim genoeg.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # De jaardatasets bewaren tussen runs: de .ods van één jaargang is 16 MB
      # en verandert nooit meer. Save op always(), zodat ook een mislukte run
      # zijn download nalaat. Zelfde patroon als transparantiedata.yml.
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache
          key: jaardatasets-v1
          restore-keys: |
            jaardatasets-

      - name: Datasetvelden bijvullen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOEKJAREN: ${{ inputs.boekjaren || '2024,2023,2022,2021,2020' }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Supabase-secrets ontbreken — zie docs/setup-supabase.md."
            exit 1
          fi
          python3 pipeline/vul_extra_velden.py --boekjaren "$BOEKJAREN"

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: pipeline/.cache
          key: jaardatasets-v1
