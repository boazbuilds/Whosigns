name: Zorgdata laden

# Fase 1: de zorgsector in bulk. Handmatig starten per boekjaar.
#
# De dataset bepaalt de doelpopulatie (organisaties mét een controleverklaring —
# ±1.010 van de 6.131 in boekjaar 2023), waarna alleen voor díé organisaties het
# archief wordt geraadpleegd. Zie pipeline/adapters/digimv.md.
#
# Standaard alle zeven boekjaren die het archief aanhoudt (2019 t/m 2025; ouder
# geeft HTTP 500). Ook 2025, waarvoor nog geen dataset is gepubliceerd: dankzij
# lijst_uit hebben we die niet nodig — het archief is per jaar op KvK-nummer te
# bevragen en dat nummer verandert niet.
#
# Hervatten is veilig: organisatie-boekjaren die al een opdracht hebben, worden
# overgeslagen. Loopt een run tegen de tijdslimiet aan, start dan een volgende
# met dezelfde invoer — of knip hem op met "vanaf" en "aantal".
on:
  workflow_dispatch:
    inputs:
      boekjaren:
        description: "Boekjaren, nieuwste eerst, komma's ertussen"
        required: true
        default: "2025,2024,2023,2022,2021,2020,2019"
      lijst_uit:
        description: "Boekjaar waar de organisatielijst uit komt (2023 is uitgezocht)"
        required: true
        default: "2023"
      uit_archief:
        description: "Lijst uit het archief zelf halen in plaats van uit de jaardataset (veel completer)"
        type: boolean
        required: false
        default: true
      vanaf:
        description: "Sla de eerste N organisaties over (voor opknippen)"
        required: false
        default: "0"
      aantal:
        description: "Verwerk er hoogstens N per boekjaar (0 = alles)"
        required: false
        default: "0"
      herlaad:
        description: "Bestaande opdrachten opnieuw beoordelen en vervangen (kost alle downloads opnieuw)"
        type: boolean
        required: false
        default: false
      hervat:
        description: "Organisaties die eerder niets opleverden overslaan (nodig om in meerdere runs door een boekjaar te komen)"
        type: boolean
        required: false
        default: true

jobs:
  laden:
    name: Zorgsector laden
    runs-on: ubuntu-latest
    # Ruim binnen de zes uur die GitHub een job gunt; de rest doet een tweede run.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Geen tesseract: OCR gebeurt bewust niet op een runner (WHOSIGNS_OCR=0
      # hieronder). Zie docs/draaiboek-acties.md — het zware lezen draait buiten
      # Actions om en komt via pipeline/oogst/ binnen. Zonder OCR gedraagt deze
      # lader zich als vóór de OCR-terugval: een gescande pdf levert geen tekst en
      # dus geen opdracht, netjes gemeld als onleesbaar.
      - name: poppler-utils en unzip installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils unzip

      # De dataset (~16 MB) en de afgeleide doelpopulatie hoeven maar één keer
      # opgehaald en berekend te worden; dat scheelt de bron werk en ons minuten.
      # Alleen de dataset en de daaruit afgeleide organisatielijst bewaren — niet de
      # pdf's. Eén jaargang verkeert al ~3 GB en die horen niet in een cache.
      - name: Organisatielijst uit de cache halen
        uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache/digimv*.ods
            pipeline/.cache/doelpopulatie_*.csv
          # v2 in de sleutel: bij een wijziging in de kolommen van de
          # organisatielijst moet de cache niet de oude versie terugzetten. Dat
          # gebeurde wél, en liet een run van 2u22m sneuvelen op de laatste stap.
          key: digimv-lijst-v2-${{ inputs.lijst_uit }}

      # Welke organisaties eerder al bekeken zijn, ongeacht de uitkomst. Zonder
      # deze lijst doet elke volgende run het halve werk opnieuw: ruwweg de helft
      # van de organisaties levert geen kantoor op, en die staan dus ook niet in
      # de database om op over te slaan. Eén boekjaar past niet in één run van
      # 5,5 uur, dus dit is het verschil tussen doorlopen en op je plaats blijven.
      #
      # De sleutel bevat run_id omdat een cache-sleutel niet te overschrijven is;
      # restore-keys pakt daardoor altijd de nieuwste eerdere versie op.
      - name: Bekeken organisaties uit de cache halen
        uses: actions/cache@v4
        with:
          path: pipeline/.cache/verwerkt_*.txt
          key: zorg-verwerkt-${{ inputs.boekjaren }}-${{ github.run_id }}
          restore-keys: |
            zorg-verwerkt-${{ inputs.boekjaren }}-
            zorg-verwerkt-

      # Wat de oogst buiten Actions al heeft bekeken telt ook mee. Die lijst staat
      # in de repo (pipeline/oogst/) en is vaak verder dan de cache; samenvoegen
      # kost niets en voorkomt dubbel werk aan beide kanten.
      - name: Bekeken organisaties samenvoegen met de oogst uit de repo
        run: |
          shopt -s nullglob
          mkdir -p pipeline/.cache
          for bestand in pipeline/oogst/verwerkt_*.txt; do
            doel="pipeline/.cache/$(basename "$bestand")"
            cat "$bestand" "$doel" 2>/dev/null | sort -u > "$doel.nieuw"
            mv "$doel.nieuw" "$doel"
            echo "$(basename "$doel"): $(wc -l < "$doel") organisaties bekeken"
          done

      - name: Zorgdata laden
        env:
          # Geen OCR op een runner; het zware lezen gebeurt buiten Actions.
          WHOSIGNS_OCR: "0"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Invoer via de omgeving: een invoerwaarde kan dan nooit als
          # shell-opdracht worden uitgevoerd.
          BOEKJAREN: ${{ inputs.boekjaren }}
          LIJST_UIT: ${{ inputs.lijst_uit }}
          VANAF: ${{ inputs.vanaf }}
          AANTAL: ${{ inputs.aantal }}
          HERLAAD: ${{ inputs.herlaad }}
          UIT_ARCHIEF: ${{ inputs.uit_archief }}
          HERVAT: ${{ inputs.hervat }}
        run: |
          # Boekjaar voor boekjaar, nieuwste eerst: loopt de job tegen de tijdslimiet
          # aan, dan zijn de meest actuele jaren in elk geval binnen. Elk boekjaar
          # is idempotent, dus opnieuw draaien pikt op waar het gebleven was.
          for jaar in $(echo "$BOEKJAREN" | tr ',' ' '); do
            echo "::group::boekjaar $jaar"
            python3 pipeline/laad_zorg.py \
              --boekjaar "$jaar" \
              --lijst-uit "$LIJST_UIT" \
              $([ "$UIT_ARCHIEF" = "true" ] && echo --uit-archief) \
              --vanaf "$VANAF" \
              --aantal "$AANTAL" \
              $([ "$HERLAAD" = "true" ] && echo --herlaad) \
              $([ "$HERVAT" = "true" ] && echo --hervat)
            echo "::endgroup::"
            # Pdf's van het afgeronde jaar opruimen: de schijf van een runner is
            # 14 GB en zes jaargangen passen daar niet in.
            rm -f pipeline/.cache/*.pdf
          done

      # De lader slaat organisatie-boekjaren over die al een opdracht hebben — goed
      # voor hervatten, maar daardoor raken nieuwe kolommen nooit gevuld zodra een
      # boekjaar eenmaal geladen is. Deze stap vult ze bij vanuit de dataset. Er
      # komt geen archief aan te pas, dus het kost seconden.
      - name: Extra velden bijvullen
        if: always()
        env:
          # Geen OCR op een runner; het zware lezen gebeurt buiten Actions.
          WHOSIGNS_OCR: "0"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIJST_UIT: ${{ inputs.lijst_uit }}
        run: python3 pipeline/vul_extra_velden.py --boekjaar "$LIJST_UIT"

      - name: Rapporten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultaten
          path: pipeline/.cache/resultaat_*.csv
          if-no-files-found: ignore
          # `.cache` is een verborgen map en die slaat upload-artifact sinds v4.4
          # standaard over — zonder deze regel komt er geen rapport uit de run.
          include-hidden-files: true
