name: Zorgdata laden

# Fase 1: de zorgsector in bulk. Handmatig starten per boekjaar.
#
# De dataset bepaalt de doelpopulatie (organisaties mét een controleverklaring —
# ±1.010 van de 6.131 in boekjaar 2023), waarna alleen voor díé organisaties het
# archief wordt geraadpleegd. Zie pipeline/adapters/digimv.md.
#
# Hervatten is veilig: organisatie-boekjaren die al een opdracht hebben, worden
# overgeslagen. Loopt een run tegen de tijdslimiet aan, start dan een volgende
# met dezelfde invoer — of knip hem op met "vanaf" en "aantal".
on:
  workflow_dispatch:
    inputs:
      boekjaar:
        description: "Boekjaar (2023 is uitgezocht; andere jaargangen vragen eerst een kolominspectie)"
        required: true
        default: "2023"
      vanaf:
        description: "Sla de eerste N organisaties over (voor opknippen)"
        required: false
        default: "0"
      aantal:
        description: "Verwerk er hoogstens N (0 = alles)"
        required: false
        default: "0"

jobs:
  laden:
    name: Zorgsector laden
    runs-on: ubuntu-latest
    # Ruim binnen de zes uur die GitHub een job gunt; de rest doet een tweede run.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: poppler-utils installeren (voor pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # De dataset (~16 MB) en de afgeleide doelpopulatie hoeven maar één keer
      # opgehaald en berekend te worden; dat scheelt de bron werk en ons minuten.
      - name: Dataset uit de cache halen
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: digimv-${{ inputs.boekjaar }}

      - name: Zorgdata laden
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 pipeline/laad_zorg.py \
            --boekjaar "${{ inputs.boekjaar }}" \
            --vanaf "${{ inputs.vanaf }}" \
            --aantal "${{ inputs.aantal }}"

      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultaat-${{ inputs.boekjaar }}
          path: pipeline/.cache/resultaat_*.csv
          if-no-files-found: ignore
