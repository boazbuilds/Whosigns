name: Pipeline

# Wekelijks (maandagochtend) en met de hand te starten via het tabblad Actions.
# Wekelijks omdat mutaties in het AFM-register het vroegste wisselsignaal zijn:
# een kantoor dat zijn vergunning inlevert, moet zijn hele portefeuille overdragen.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      alleen_seed:
        description: "Alleen de seed-bestanden verversen, niets naar de database schrijven"
        type: boolean
        default: false

jobs:
  kantoren:
    name: AFM-kantorenregister bijwerken
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Weigert (rood, niets geschreven) als de export ineens een tiende korter
      # is dan de vorige snapshot. Hernoemingen gaan als alias mee, verdwenen
      # kantoren naar kantoren_vervallen.csv.
      - name: Register ophalen en seed verversen
        run: python3 pipeline/adapters/afm_register.py

      # Alle tests tegen de nieuwe seed, vóór er iets wordt vastgelegd. Op
      # 28-9-2026 hernoemde de snapshot 13000483 en daarmee faalde
      # test_kantoor_match.py op main — maar een push met GITHUB_TOKEN start
      # geen andere workflows, dus Checks draaide er nooit op. Het viel pas op
      # bij de eerstvolgende pull request, die er niets mee te maken had.
      #
      # De uitslag blokkeert niets: de snapshot is wat het register zegt, en de
      # database hoort die stand te krijgen. Faalt er een test, dan wordt de
      # run aan het eind rood — dezelfde dag, met de naam van het testbestand.
      - name: Tests tegen de nieuwe seed
        id: tests
        run: |
          mislukt=""
          for test in pipeline/test_*.py; do
            echo "::group::$test"
            python3 "$test" || mislukt="$mislukt $test"
            echo "::endgroup::"
          done
          echo "mislukt=$mislukt" >> "$GITHUB_OUTPUT"

      - name: Wijzigingen in het register vastleggen
        # De git-historie van kantoren.csv is ons mutatielog: een kantoor dat
        # verdwijnt of bijkomt, is zichtbaar als diff. Aliassen en vervallen
        # kantoren horen bij dezelfde mutatie en gaan in dezelfde commit.
        run: |
          seeds="pipeline/seed/kantoren.csv pipeline/seed/kantoor_alias.csv pipeline/seed/kantoren_vervallen.csv"
          if [ -z "$(git status --porcelain -- $seeds)" ]; then
            echo "geen mutaties in het AFM-register"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $seeds
            git commit -m "AFM-register: wekelijkse snapshot"
            git push
          fi

      - name: Naar de database schrijven
        if: ${{ inputs.alleen_seed != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::notice::Supabase-secrets ontbreken nog — zie docs/setup-supabase.md."
            echo "De seed is bijgewerkt; de databasestap wordt overgeslagen."
            exit 0
          fi
          python3 pipeline/laad_kantoren.py --offline

      - name: Testuitslag
        if: ${{ always() && steps.tests.outputs.mislukt != '' }}
        env:
          MISLUKT: ${{ steps.tests.outputs.mislukt }}
        run: |
          for test in $MISLUKT; do
            echo "::error::$test faalt op de seed van deze snapshot"
          done
          exit 1
