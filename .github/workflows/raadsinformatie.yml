name: Raadsinformatie laden

# Controleverklaringen uit raadsstukken van gemeenten, provincies,
# waterschappen en gemeenschappelijke regelingen.
#
# Open Raadsinformatie levert de volledige documenttekst mee in het
# zoekantwoord, dus er worden geen pdf's gedownload en er komt geen
# tekstherkenning aan te pas. Vindplaats en leesregels:
# pipeline/adapters/raadsinformatie.py.
#
# Gemeten (8-8-2026, droogloop over de vólledige bron — alle 21.339 documenten
# die de zoekzin bevatten): 4.057 controleopdrachten bij 1.575 organisaties,
# boekjaren 2010 t/m 2025, en geen enkele organisatie die over hetzelfde
# boekjaar twee verschillende kantoren toegeschreven kreeg.
#
# Sinds 5-10-2026 twee zoekvragen (25.622 documenten samen) en oordeel,
# continuïteit en tekenend accountant uit dezelfde verklaring. Droogloop over
# beide, met de database alleen gelezen (6-10-2026): 4.652 ondertekende
# controles, waarvan 414 nieuw (313 uit de tweede zoekvraag) en 3.948
# bestaande eigen rijen met een nieuwe vindplaats; 3.970 oordelen en 2.006
# tekenend accountants erbij, 284 plaatsen aangevuld. Zie
# docs/bronverkenning-raadsinformatie.md.
#
# Deze bron opent een populatie die tot nu toe ontbrak: gemeenschappelijke
# regelingen, omgevingsdiensten, veiligheidsregio's en recreatieschappen.
on:
  # Draait vanzelf zodra de lader, de adapter of deze workflow op main landt —
  # zelfde patroon als de andere ladingen; dispatchen kan niet iedereen, en
  # zo landt een verbeterde leesregel met de merge zelf. Een push-event heeft
  # geen inputs, dus de stappen hieronder vallen terug op de standaarden.
  push:
    branches: [main]
    paths:
      - "pipeline/laad_raadsinformatie.py"
      - "pipeline/adapters/raadsinformatie.py"
      - ".github/workflows/raadsinformatie.yml"
  workflow_dispatch:
    inputs:
      maximum:
        description: "Hoogstens zoveel documenten lezen, over beide zoekvragen samen"
        required: true
        default: "40000"
      droogloop:
        description: "Niets naar de database schrijven; alleen het CSV-rapport"
        type: boolean
        required: false
        default: false
      vervang:
        description: "Eerdere raadsinformatie-uitkomst vervangen door deze doorloop (na verbeterde leesregels)"
        type: boolean
        required: false
        default: false
  # Zelfde invoer met dezelfde standaarden, voor "Alles verversen".
  workflow_call:
    inputs:
      maximum:
        type: string
        required: false
        default: "40000"
      droogloop:
        type: boolean
        required: false
        default: false
      vervang:
        type: boolean
        required: false
        default: false

# Een push-run die samenvalt met "Alles verversen" zou twee keer dezelfde
# nieuwe organisatie kunnen aanmaken, en twee vervang-rondes wissen elkaars
# vers geschreven rijen. De tweede wacht dus. Een eigen groep en niet
# "verversen": die heeft "Alles verversen" zelf, en dezelfde groep in de
# aanroeper en de aangeroepen workflow is een impasse.
concurrency:
  group: raadsinformatie
  cancel-in-progress: false

jobs:
  laden:
    name: Controleverklaringen uit raadsstukken
    runs-on: ubuntu-latest
    # Gemeten 5-10-2026, lokaal en met de database alleen gelezen: de volle
    # doorloop over beide zoekvragen (25.622 documenten, een vijfde seconde
    # pauze per pagina van honderd) kostte 13,5 minuten, voorladen van de
    # database inbegrepen. Daarbovenop komen in een echte run zo'n 4.800
    # schrijfverzoeken — de doorloop met ruim 4.000 upserts kostte op een
    # runner eerder 25 minuten in totaal. Verwacht dus een half uur à drie
    # kwartier; dit plafond laat ruimte voor een trage API zonder dat een
    # hangende run de hele dag een runner bezet. Opknippen hoeft niet, en
    # mag ook niet met --vervang (die wist alleen na een volledige doorloop).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Kantorenlijsten bijwerken
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DROOGLOOP: ${{ inputs.droogloop || 'false' }}
        run: |
          if [ -z "$SUPABASE_URL" ] && [ "$DROOGLOOP" != "true" ]; then
            echo "::error::Supabase-secrets ontbreken — zie docs/setup-supabase.md."
            exit 1
          fi
          [ -z "$SUPABASE_URL" ] || python3 pipeline/laad_kantoren.py --offline

      - name: Raadsinformatie laden
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Bij een push zijn er geen inputs; zonder deze terugval kreeg de
          # lader `--maximum ""` en viel argparse om.
          MAXIMUM: ${{ inputs.maximum || '40000' }}
          DROOGLOOP: ${{ inputs.droogloop || 'false' }}
          # Een push-run vervangt, net als "Alles verversen". Een verbeterde
          # leesregel geeft schonere namen ("Gemeente Venlo" in plaats van
          # "Gemeente Venlo (‘de gemeente’)"), en zonder vervangen blijft de oude
          # rij naast de nieuwe staan: dezelfde controle twee keer in het
          # marktaandeel. De lader wist alleen na een aantoonbaar volledige
          # doorloop (zie laad_raadsinformatie.py).
          VERVANG: ${{ github.event_name == 'push' && 'true' || inputs.vervang }}
        run: |
          python3 pipeline/laad_raadsinformatie.py \
            --maximum "$MAXIMUM" \
            $([ "$DROOGLOOP" = "true" ] && echo --droogloop) \
            $([ "$VERVANG" = "true" ] && echo --vervang)

      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultaten-raadsinformatie
          path: pipeline/.cache/resultaat_raadsinformatie.csv
          if-no-files-found: ignore
          include-hidden-files: true
