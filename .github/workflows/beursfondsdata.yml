name: Beursfondsdata laden

# Jaarverslagen van beursfondsen uit het AFM-register financiële
# verslaggeving (terug tot boekjaar 2006): per gedeponeerd jaarverslag de
# controleverklaring, het oordeel en het ondertekenende kantoor. Vindplaatsen
# en leesregels: pipeline/adapters/afm_verslaggeving.py; keuzes (batch per
# boekjaren, bestaande rijen winnen, nooit stil gokken):
# pipeline/laad_beursfondsen.py.
#
# Gemeten (4-8-2026): 4.201 jaarlijkse deponeringen van 547 instellingen,
# ~150-270 per boekjaar van elk 5-30 MB. Daarom draait dit per bereik van
# boekjaren; begin recent en werk in een paar runs terug naar 2006.
on:
  # Maandelijks het vórige boekjaar opnieuw langslopen. Jaarverslagen over
  # boekjaar N worden in de loop van jaar N+1 gedeponeerd, verspreid over het
  # hele jaar: wie in maart leest mist de late indieners. Sinds de lader
  # bestaande rijen vóór de download eruit filtert kost zo'n herhaling alleen
  # nog het doorbladeren van het register plus de écht nieuwe deponeringen.
  schedule:
    - cron: "0 4 5 * *"
  # En bij een wijziging aan de lader of aan deze workflow, zodat een merge de
  # nieuwe stand meteen ophaalt — dezelfde knoploze afspraak als bij de
  # migraties en de zorgoogst.
  push:
    branches: [main]
    paths:
      - "pipeline/laad_beursfondsen.py"
      - "pipeline/adapters/afm_verslaggeving.py"
      - ".github/workflows/beursfondsdata.yml"
  workflow_dispatch:
    inputs:
      boekjaren:
        description: 'Boekjaren, bijvoorbeeld "2020-2025", "2016" of "alle"'
        type: string
        required: false
        default: "2020-2025"
      droogloop:
        description: "Niets naar de database schrijven; alleen het CSV-rapport"
        type: boolean
        required: false
        default: false

jobs:
  laden:
    name: Beursfondsverslagen lezen
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Geen tesseract: OCR draait niet op een runner (WHOSIGNS_OCR=0 hieronder).
      # Zie docs/draaiboek-acties.md.
      - name: poppler installeren (pdftotext)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Kantorenlijsten bijwerken
        env:
          # Geen OCR op een runner; het zware lezen gebeurt buiten Actions.
          WHOSIGNS_OCR: "0"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DROOGLOOP: ${{ inputs.droogloop }}
        run: |
          if [ -z "$SUPABASE_URL" ] && [ "$DROOGLOOP" != "true" ]; then
            echo "::error::Supabase-secrets ontbreken — zie docs/setup-supabase.md."
            exit 1
          fi
          [ -z "$SUPABASE_URL" ] || python3 pipeline/laad_kantoren.py --offline

      - name: Jaarverslagen lezen en laden
        env:
          # Geen OCR op een runner; het zware lezen gebeurt buiten Actions.
          WHOSIGNS_OCR: "0"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DROOGLOOP: ${{ inputs.droogloop }}
          BOEKJAREN: ${{ inputs.boekjaren }}
        run: |
          # Een push- of schedule-event heeft geen inputs. Dan het vórige
          # kalenderjaar: dat is het boekjaar waarvan de verslagen nu worden
          # gedeponeerd. Geen jaartal in dit bestand, want dat veroudert.
          if [ -z "$BOEKJAREN" ]; then
            BOEKJAREN=$(( $(date -u +%Y) - 1 ))
            echo "geen invoer: boekjaar $BOEKJAREN"
          fi
          python3 pipeline/laad_beursfondsen.py \
            --boekjaren "$BOEKJAREN" \
            $([ "$DROOGLOOP" = "true" ] && echo --droogloop)

      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultaten-beursfondsen
          path: pipeline/.cache/resultaat_beursfondsen.csv
          if-no-files-found: ignore
          include-hidden-files: true
