name: Beursfondsdata laden

# Jaarverslagen van beursfondsen uit het AFM-register financiële
# verslaggeving (terug tot boekjaar 2006): per gedeponeerd jaarverslag de
# controleverklaring, het oordeel en het ondertekenende kantoor. Vindplaatsen
# en leesregels: pipeline/adapters/afm_verslaggeving.py; keuzes (batch per
# boekjaren, bestaande rijen winnen, nooit stil gokken):
# pipeline/laad_beursfondsen.py.
#
# Gemeten (4-8-2026): 4.201 jaarlijkse deponeringen van 547 instellingen,
# ~150-270 per boekjaar van elk 5-30 MB. Daarom draait dit per bereik van
# boekjaren; begin recent en werk in een paar runs terug naar 2006.
on:
  workflow_dispatch:
    inputs:
      boekjaren:
        description: 'Boekjaren, bijvoorbeeld "2020-2025", "2016" of "alle"'
        type: string
        required: false
        default: "2020-2025"
      droogloop:
        description: "Niets naar de database schrijven; alleen het CSV-rapport"
        type: boolean
        required: false
        default: false

jobs:
  laden:
    name: Beursfondsverslagen lezen
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: poppler en tesseract installeren (pdftotext, ocr-terugval)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-nld

      - name: Kantorenlijsten bijwerken
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DROOGLOOP: ${{ inputs.droogloop }}
        run: |
          if [ -z "$SUPABASE_URL" ] && [ "$DROOGLOOP" != "true" ]; then
            echo "::error::Supabase-secrets ontbreken — zie docs/setup-supabase.md."
            exit 1
          fi
          [ -z "$SUPABASE_URL" ] || python3 pipeline/laad_kantoren.py --offline

      - name: Jaarverslagen lezen en laden
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DROOGLOOP: ${{ inputs.droogloop }}
        run: |
          python3 pipeline/laad_beursfondsen.py \
            --boekjaren "${{ inputs.boekjaren }}" \
            $([ "$DROOGLOOP" = "true" ] && echo --droogloop)

      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultaten-beursfondsen
          path: pipeline/.cache/resultaat_beursfondsen.csv
          if-no-files-found: ignore
          include-hidden-files: true
