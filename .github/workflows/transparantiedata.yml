name: Transparantiedata laden

# OOB-cliëntenlijsten uit de transparantieverslagen van de zes kantoren met
# OOB-vergunning — de enige openbare vindplaats van de accountant van banken,
# verzekeraars en beursfondsen (ASML, ABN AMRO, Adyen). Vindplaatsen en
# leesregels: pipeline/seed/transparantieverslagen.csv en
# pipeline/adapters/transparantie.py.
#
# Gemeten (4-8-2026, negentien verslagen): 2.258 cliëntregels, waarvan een
# flink deel al bekend is uit de dVi (corporaties zijn óók OOB) — bestaande
# rijen winnen, dit vult alleen aan wat nergens anders staat.
#
# Zelden nodig: alleen draaien wanneer er nieuwe verslagen aan de seed-lijst
# zijn toegevoegd (elk voorjaar/najaar één per kantoor).
on:
  workflow_dispatch:
    inputs:
      droogloop:
        description: "Niets naar de database schrijven; alleen het CSV-rapport"
        type: boolean
        required: false
        default: false
  # Zelfde invoer met dezelfde standaarden, voor "Alles verversen".
  workflow_call:
    inputs:
      droogloop:
        type: boolean
        required: false
        default: false

jobs:
  laden:
    name: OOB-cliëntenlijsten laden
    runs-on: ubuntu-latest
    # Was 30, en op 21-8-2026 werd de run op precies die grens afgebroken. De
    # meting van ±30 minuten kwam uit de tijd van 19 verslagen; de seed-lijst
    # staat inmiddels op 66 en elke run begon bovendien met een kale cache, dus
    # alle pdf's opnieuw downloaden. Het uur is de reserve; de echte winst zit
    # in de cache hieronder, die een herhaalde run in minuten laat eindigen.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # De gedownloade verslagen bewaren tussen runs. haal_verslag() slaat een
      # bestand dat er al staat over, dus met een gevulde cache verdwijnt het
      # downloadwerk — het trage en fragiele deel — vrijwel helemaal.
      #
      # Bewust restore/save los van elkaar, met save op always(): de gewone
      # cache-actie bewaart pas in de post-stap van een géslaagde job, en juist
      # de afgebroken run — die het meeste downloadwerk heeft verzet — liet zo
      # niets na. De sleutel hangt aan de seed-lijst; komt er een verslag bij,
      # dan begint hij via restore-keys met alles wat er al was.
      - uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache
          key: transparantie-${{ hashFiles('pipeline/seed/transparantieverslagen.csv') }}
          restore-keys: |
            transparantie-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: poppler installeren (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Kantorenlijsten bijwerken
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DROOGLOOP: ${{ inputs.droogloop }}
        run: |
          if [ -z "$SUPABASE_URL" ] && [ "$DROOGLOOP" != "true" ]; then
            echo "::error::Supabase-secrets ontbreken — zie docs/setup-supabase.md."
            exit 1
          fi
          [ -z "$SUPABASE_URL" ] || python3 pipeline/laad_kantoren.py --offline

      - name: Transparantieverslagen laden
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DROOGLOOP: ${{ inputs.droogloop }}
        run: |
          python3 pipeline/laad_transparantie.py \
            $([ "$DROOGLOOP" = "true" ] && echo --droogloop)

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pipeline/.cache
          key: transparantie-${{ hashFiles('pipeline/seed/transparantieverslagen.csv') }}

      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultaten-transparantie
          path: pipeline/.cache/resultaat_transparantie.csv
          if-no-files-found: ignore
          include-hidden-files: true
