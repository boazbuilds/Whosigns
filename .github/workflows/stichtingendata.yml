name: Stichtingendata laden

# De goededoelensector in bulk (backlog-item 3, route uit
# docs/bronverkenning-stichtingen.md). Handmatig starten per set boekjaren.
#
# Het CBF-register bepaalt de doelpopulatie: 714 erkende goede doelen, waarvan 295 in
# categorie D/E — daar is een controleverklaring een harde norm (8.1.3 van de
# Erkenningsregeling). Het jaarverslag staat op een af te leiden URL bij het CBF, dus
# er is geen zoekfunctie of naam-matching nodig; het KvK-nummer komt uit het register.
#
# Gemeten op boekjaar 2024 (hele categorie D/E): 278 van de 295 jaarverslagen
# gelezen, 241 controleverklaringen, 156 kantoren herleid. De rest is grotendeels
# vrijwillige controle door kantoren buiten het AFM-register — die staan in
# seed/kantoren_overig.csv en groeien aan via de review-queue.
#
# Standaard 2019 t/m 2025: ouder houdt het CBF niet meer aan (12 treffers in 2018
# tegen 514 in 2019), en 2025 is nog aan het vullen.
#
# Hervatten is veilig: organisatie-boekjaren die al een opdracht hebben, worden
# overgeslagen. Loopt een run tegen de tijdslimiet aan, start dan een volgende met
# dezelfde invoer — of knip hem op met "vanaf" en "aantal".
on:
  workflow_dispatch:
    inputs:
      boekjaren:
        description: "Boekjaren, nieuwste eerst, komma's ertussen"
        required: true
        default: "2025,2024,2023,2022,2021,2020,2019"
      categorieen:
        description: "CBF-omvangcategorieën (D,E = controleverklaring verplicht)"
        required: true
        default: "D,E"
      terugval:
        description: "Ook op de eigen website zoeken als het CBF niets heeft (langzamer)"
        type: boolean
        required: false
        default: false
      vanaf:
        description: "Sla de eerste N organisaties over (voor opknippen)"
        required: false
        default: "0"
      aantal:
        description: "Verwerk er hoogstens N per boekjaar (0 = alles)"
        required: false
        default: "0"
      herlaad:
        description: "Bestaande opdrachten opnieuw beoordelen en vervangen"
        type: boolean
        required: false
        default: false
      droogloop:
        description: "Niets naar de database schrijven; alleen het CSV-rapport"
        type: boolean
        required: false
        default: false

# Zelfde groep als de stichtingenlus: dit script schrijft dezelfde tabellen en
# dezelfde review-queue. Een handmatige run wacht dus netjes tot de lusronde
# klaar is in plaats van er dwars doorheen te schrijven.
concurrency:
  group: stichtingenlus
  cancel-in-progress: false

jobs:
  laden:
    name: Goede doelen laden
    runs-on: ubuntu-latest
    # Ruim binnen de zes uur die GitHub een job gunt; de rest doet een tweede run.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Zie stichtingenlus.yml: tesseract is de terugval voor gescande jaarverslagen.
      - name: poppler-utils en tesseract installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-nld

      # De kantorenlijst moet in de database staan vóór er opdrachten aan hangen —
      # inclusief de kantoren zonder Wta-vergunning uit seed/kantoren_overig.csv,
      # want anders belandt een derde van deze sector in de review-queue.
      - name: Kantorenlijsten bijwerken
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::notice::Supabase-secrets ontbreken nog — zie docs/setup-supabase.md."
            exit 0
          fi
          python3 pipeline/laad_kantoren.py --offline

      - name: Stichtingendata laden
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Invoer via de omgeving: een invoerwaarde kan dan nooit als
          # shell-opdracht worden uitgevoerd.
          BOEKJAREN: ${{ inputs.boekjaren }}
          CATEGORIEEN: ${{ inputs.categorieen }}
          VANAF: ${{ inputs.vanaf }}
          AANTAL: ${{ inputs.aantal }}
          TERUGVAL: ${{ inputs.terugval }}
          HERLAAD: ${{ inputs.herlaad }}
          DROOGLOOP: ${{ inputs.droogloop }}
        run: |
          # Boekjaar voor boekjaar, nieuwste eerst: loopt de job tegen de tijdslimiet
          # aan, dan zijn de meest actuele jaren in elk geval binnen. Elk boekjaar is
          # idempotent, dus opnieuw draaien pikt op waar het gebleven was.
          for jaar in $(echo "$BOEKJAREN" | tr ',' ' '); do
            echo "::group::boekjaar $jaar"
            python3 pipeline/laad_stichtingen.py \
              --boekjaar "$jaar" \
              --categorieen "$CATEGORIEEN" \
              --vanaf "$VANAF" \
              --aantal "$AANTAL" \
              $([ "$TERUGVAL" = "true" ] && echo --terugval) \
              $([ "$HERLAAD" = "true" ] && echo --herlaad) \
              $([ "$DROOGLOOP" = "true" ] && echo --droogloop)
            echo "::endgroup::"
            # De lader gooit pdf's na het lezen weg (geen --bewaar-pdf), maar een
            # afgebroken run kan er hebben laten staan: 295 jaarverslagen is ruim 1 GB
            # en de schijf van een runner is 14 GB.
            rm -f pipeline/.cache/*.pdf
          done

      - name: Rapporten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultaten-stichtingen
          path: pipeline/.cache/resultaat_stichtingen_*.csv
          if-no-files-found: ignore
          # Zonder deze regel wordt er niets bewaard: upload-artifact slaat sinds
          # v4.4 verborgen bestanden over, en `.cache` begint met een punt. De run
          # van 30-7-2026 meldde "No files were found with the provided path"
          # terwijl de rapporten er gewoon stonden.
          include-hidden-files: true
